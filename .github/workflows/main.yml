name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Kuttab ZIP
        run: |
          unzip -o Kuttab.zip -d temp_extracted
          PROJECT_DIR=$(find temp_extracted -name "pubspec.yaml" -exec dirname {} \;)
          cp -r $PROJECT_DIR/* .

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Bypassing AGP Check)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuttab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
