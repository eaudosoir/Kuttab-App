name: Build Original Kuttab APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Original Kuttab Project
        run: |
          unzip -o Kuttab.zip -d extracted_app
          PROJ_DIR=$(find extracted_app -name "pubspec.yaml" -exec dirname {} \;)
          cp -r $PROJ_DIR/* .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Original APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuttab-original-apk
          path: build/app/outputs/flutter-apk/app-release.apk
